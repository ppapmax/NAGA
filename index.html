<!DOCTYPE html>
<html lang="zh-Hant">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1">

<title>NAGA</title>

<style>

@font-face{

font-family:"NAGAfont";

src:

url("NotoSerifTC-SemiBold.ttf")

format("truetype");

}

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{

width:100vw;

height:100vh;

overflow:hidden;

background:black;

font-family:"NAGAfont";

}

#bgVideo{

position:fixed;

top:0;

left:0;

width:100vw;

height:100vh;

object-fit:cover;

z-index:-2;

}

.overlay{

position:fixed;

inset:0;

background:

rgba(0,0,0,.32);

z-index:-1;

}

.container{

width:100%;

height:100%;

display:flex;

justify-content:center;

align-items:center;

padding:8vw;

}

.card{

width:100%;

max-width:700px;

min-height:45vh;

display:flex;

justify-content:center;

align-items:center;

flex-direction:column;

text-align:center;

padding:40px;

}

button{

padding:
16px 44px;

border-radius:999px;

border:
1px solid rgba(255,255,255,.85);

background:
rgba(255,255,255,.06);

backdrop-filter:
blur(6px);

color:white;

font-size:22px;

font-family:"NAGAfont";

letter-spacing:8px;

}

#msg{

width:100%;

display:none;

color:white;

font-family:"NAGAfont";

font-size:

clamp(
38px,
9vw,
74px
);

font-weight:600;

line-height:1.45;

letter-spacing:-1px;

text-shadow:
0 0 12px rgba(255,255,255,.12);

word-break:keep-all;

}

.cursor{

display:inline-block;

animation:blink .8s infinite;

}

@keyframes blink{

0%{
opacity:1;
}

50%{
opacity:0;
}

100%{
opacity:1;
}

}

</style>

</head>

<body>

<video
id="bgVideo"
autoplay
muted
loop
playsinline>

<source
src="bg.mp4"
type="video/mp4">

</video>

<div class="overlay"></div>

<div class="container">

<div class="card">

<button
id="start">

NAGA

</button>

<div
id="msg">

</div>

</div>

</div>

<audio
id="music"
src="music.mp3"
loop>

</audio>

<script>

const messages=[

"第一句放這裡",

"第二句放這裡",

"第三句放這裡",

"第四句放這裡",

"第五句放這裡",

"第六句放這裡",

"第七句放這裡",

"第八句放這裡",

"第九句放這裡",

"第十句放這裡"

]

const start=
document.getElementById("start")

const msg=
document.getElementById("msg")

const music=
document.getElementById("music")

function typeWriter(text){

msg.innerHTML=""

msg.style.display="block"

let i=0

const speed=90

const typing=setInterval(()=>{

msg.innerHTML=

text.substring(0,i)

+

'<span class="cursor">|</span>'

i++

if(i>text.length){

clearInterval(typing)

msg.innerHTML=text

}

},speed)

}

start.onclick=()=>{

const random=

Math.floor(

Math.random()

*

messages.length

)

start.style.display="none"

music.volume=.7

music.play()

typeWriter(
messages[random]
)

}

</script>

</body>

</html>
