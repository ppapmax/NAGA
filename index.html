<!DOCTYPE html>
<html lang="zh-Hant">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1">

<title>NAGA</title>

<style>

@font-face{

font-family:"NAGAfont";

src:
url("NotoSerifTC-SemiBold.ttf")
format("truetype");

}

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{

width:100vw;
height:100vh;
overflow:hidden;
background:black;
font-family:"NAGAfont",serif;

}

#bgVideo{

position:fixed;
inset:0;
width:100vw;
height:100vh;
object-fit:cover;
z-index:-2;

}

.overlay{

position:fixed;
inset:0;
background:rgba(0,0,0,.42);
z-index:-1;

}

#start{

position:fixed;

left:50%;
top:50%;

transform:
translate(-50%,-50%);

padding:
14px 46px;

border:
1px solid rgba(255,255,255,.9);

border-radius:999px;

background:
rgba(0,0,0,.22);

color:white;

font-size:24px;

font-family:"NAGAfont";

letter-spacing:8px;

backdrop-filter:
blur(8px);

z-index:10;

}

#evaText{

position:fixed;

inset:0;

display:flex;

justify-content:center;

align-items:center;

pointer-events:none;

padding:8vw;

}

.layout{

display:flex;

align-items:center;

gap:6vw;

max-width:90vw;

}

.leftVertical{

writing-mode:vertical-rl;

text-orientation:mixed;

font-size:

clamp(
24px,
7vw,
52px
);

font-weight:700;

line-height:1.1;

letter-spacing:-2px;

text-shadow:
0 0 10px rgba(0,0,0,.95);

white-space:nowrap;

}

.centerLine{

width:1px;

height:52vh;

background:
rgba(255,255,255,.7);

box-shadow:
0 0 10px rgba(255,255,255,.25);

}

.rightGroup{

display:flex;

flex-direction:column;

justify-content:center;

gap:4vh;

max-width:54vw;

}

.big{

font-size:

clamp(
48px,
13vw,
96px
);

font-weight:900;

line-height:.95;

letter-spacing:-6px;

text-shadow:
0 0 12px rgba(0,0,0,.95);

word-break:break-all;

}

.small{

font-size:

clamp(
18px,
5vw,
38px
);

font-weight:700;

line-height:1.35;

letter-spacing:-1px;

text-shadow:
0 0 10px rgba(0,0,0,.95);

word-break:break-all;

}

.cursor{

display:inline-block;

animation:
blink .8s infinite;

}

@keyframes blink{

0%{
opacity:1;
}

50%{
opacity:0;
}

100%{
opacity:1;
}

}

</style>

</head>

<body>

<video
id="bgVideo"
autoplay
muted
loop
playsinline>

<source
src="bg.mp4"
type="video/mp4">

</video>

<div class="overlay"></div>

<button id="start">

NAGA

</button>

<div id="evaText"></div>

<audio
id="music"
src="music.mp3"
loop>

</audio>

<script>

const layouts=[

[
"2026年的人類將記憶壓縮進銀色光碟之中",
"以為這樣就能對抗遺忘",
"卻忘了自己早已失去記憶的能力"
],

[
"光碟反射著文明的光",
"人們凝視著那些旋轉的圓盤",
"像凝視著屬於未來的新神"
],

[
"Naga盤旋於時間之上",
"而人類則將靈魂燒錄進一片片塑膠之中",
"試圖留下存在過的證明"
],

[
"那是一個將情感轉換成檔案格式的年代",
"愛、痛苦與記憶",
"全都能被複製與刪除"
],

[
"2026年的人們相信",
"只要資料還能讀取",
"就代表文明從未真正死亡"
],

[
"他們將未來刻錄進光碟表面",
"卻沒發現那些刮痕",
"早已像預言般記錄著文明的崩壞"
],

[
"光碟不斷旋轉",
"如同Naga象徵的輪迴",
"而人類也在科技之中反覆重演相同的慾望"
],

[
"人們曾經害怕光碟損壞、資料消失",
"後來才明白",
"最先損壞的是人類自身的感知"
],

[
"2783年的我們考古2026年的遺物時發現",
"他們留下最多的不是思想",
"而是無數無法讀取的檔案"
],

[
"當最後一片光碟停止轉動後",
"人類終於聽見了",
"那些被科技噪音掩蓋已久的自己"
]

]

const start=
document.getElementById("start")

const evaText=
document.getElementById("evaText")

const music=
document.getElementById("music")

function typeLine(
element,
text,
speed=42
){

let i=0

element.innerHTML=""

const timer=

setInterval(()=>{

element.innerHTML=

text.substring(0,i)

+

'<span class="cursor">|</span>'

i++

if(i>text.length){

clearInterval(timer)

element.innerHTML=text

}

},speed)

}

function showLayout(data){

evaText.innerHTML=""

const wrap=
document.createElement("div")

wrap.className="layout"

const left=
document.createElement("div")

left.className="leftVertical"

const line=
document.createElement("div")

line.className="centerLine"

const right=
document.createElement("div")

right.className="rightGroup"

const big=
document.createElement("div")

big.className="big"

const small=
document.createElement("div")

small.className="small"

wrap.appendChild(left)
wrap.appendChild(line)
wrap.appendChild(right)

right.appendChild(big)
right.appendChild(small)

evaText.appendChild(wrap)

typeLine(left,data[0],36)

setTimeout(()=>{

typeLine(big,data[1],42)

},1800)

setTimeout(()=>{

typeLine(small,data[2],34)

},3800)

}

start.onclick=()=>{

start.style.display="none"

music.volume=.7

music.play()

const random=

Math.floor(

Math.random()

*

layouts.length

)

showLayout(

layouts[random]

)

}

</script>

</body>

</html>
