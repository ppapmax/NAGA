<!DOCTYPE html>
<html lang="zh-Hant">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1">

<title>NAGA</title>

<style>

@font-face{

font-family:"Cubic";

src:

url("Cubic_11.ttf")

format("truetype");

}

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{

width:100vw;

height:100vh;

overflow:hidden;

background:black;

}

#bgVideo{

position:fixed;

top:0;

left:0;

width:100vw;

height:100vh;

object-fit:cover;

z-index:-2;

}

.overlay{

position:fixed;

inset:0;

background:

rgba(0,0,0,.25);

z-index:-1;

}

.container{

width:100%;

height:100%;

display:flex;

justify-content:center;

align-items:center;

padding:8vw;

}

.card{

width:100%;

max-width:700px;

min-height:45vh;

display:flex;

justify-content:center;

align-items:center;

flex-direction:column;

text-align:center;

padding:40px;

}

button{

padding:

16px 40px;

border-radius:999px;

border:

1px solid white;

background:

rgba(255,255,255,.08);

color:white;

font-size:20px;

font-family:"Cubic";

letter-spacing:4px;

}

#msg{

display:none;

font-family:"Cubic";

color:white;

font-size:

clamp(
34px,
8vw,
60px
);

line-height:1.8;

letter-spacing:4px;

animation:

fade 2.5s ease;

}

@keyframes fade{

0%{

opacity:0;

transform:

translateY(30px);

filter:

blur(10px);

}

100%{

opacity:1;

transform:

translateY(0);

filter:

blur(0);

}

}

</style>

</head>

<body>

<video
id="bgVideo"
autoplay
muted
loop
playsinline>

<source
src="bg.mp4"
type="video/mp4">

</video>

<div class="overlay"></div>

<div class="container">

<div class="card">

<button
id="start">

開始

</button>

<div
id="msg">

</div>

</div>

</div>

<audio
id="music"
src="music.mp3"
loop>

</audio>

<script>

const messages=[

"第一句放這裡",

"第二句放這裡",

"第三句放這裡",

"第四句放這裡",

"第五句放這裡",

"第六句放這裡",

"第七句放這裡",

"第八句放這裡",

"第九句放這裡",

"第十句放這裡"

]

const start=
document
.getElementById(
"start"
)

const msg=
document
.getElementById(
"msg"
)

const music=
document
.getElementById(
"music"
)

start.onclick=()=>{

const random=

Math.floor(

Math.random()

*

messages.length

)

msg.innerText=

messages[random]

start.style.display=

"none"

msg.style.display=

"block"

music.volume=.7

music.play()

}

</script>

</body>

</html>
