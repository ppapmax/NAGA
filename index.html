<!DOCTYPE html>
<html lang="zh-Hant">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1">

<title>NAGA</title>

<style>

@font-face{

font-family:"NAGAfont";

src:

url("NotoSerifTC-SemiBold.ttf")

format("truetype");

}

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{

width:100vw;

height:100vh;

overflow:hidden;

background:black;

font-family:"NAGAfont";

}

#bgVideo{

position:fixed;

top:0;

left:0;

width:100vw;

height:100vh;

object-fit:cover;

z-index:-2;

}

.overlay{

position:fixed;

inset:0;

background:

rgba(0,0,0,.32);

z-index:-1;

}

.container{

width:100%;

height:100%;

display:flex;

justify-content:center;

align-items:center;

padding:8vw;

}

.card{

width:100%;

max-width:700px;

min-height:45vh;

display:flex;

justify-content:center;

align-items:center;

flex-direction:column;

text-align:center;

padding:40px;

}

button{

padding:
16px 44px;

border-radius:999px;

border:
1px solid rgba(255,255,255,.85);

background:
rgba(255,255,255,.06);

backdrop-filter:
blur(6px);

color:white;

font-size:22px;

font-family:"NAGAfont";

letter-spacing:8px;

}

#msg{

width:100%;

display:none;

color:white;

font-family:"NAGAfont";

font-size:

clamp(
38px,
9vw,
74px
);

font-weight:600;

line-height:1.45;

letter-spacing:-1px;

text-shadow:
0 0 12px rgba(255,255,255,.12);

word-break:keep-all;

}

.cursor{

display:inline-block;

animation:blink .8s infinite;

}

@keyframes blink{

0%{
opacity:1;
}

50%{
opacity:0;
}

100%{
opacity:1;
}

}

</style>

</head>

<body>

<video
id="bgVideo"
autoplay
muted
loop
playsinline>

<source
src="bg.mp4"
type="video/mp4">

</video>

<div class="overlay"></div>

<div class="container">

<div class="card">

<button
id="start">

NAGA

</button>

<div
id="msg">

</div>

</div>

</div>

<audio
id="music"
src="music.mp3"
loop>

</audio>

<script>

const messages=[

"2026年的人類將記憶壓縮進銀色光碟之中，以為這樣就能對抗遺忘，卻忘了自己早已失去記憶的能力。",

"光碟反射著文明的光，人們凝視著那些旋轉的圓盤，像凝視著屬於未來的新神。",

"Naga盤旋於時間之上，而人類則將靈魂燒錄進一片片塑膠之中，試圖留下存在過的證明。",

"那是一個將情感轉換成檔案格式的年代，愛、痛苦與記憶，全都能被複製與刪除。",

"2026年的人們相信，只要資料還能讀取，就代表文明從未真正死亡。",

"他們將未來刻錄進光碟表面，卻沒發現那些刮痕，早已像預言般記錄著文明的崩壞。",

"光碟不斷旋轉，如同Naga象徵的輪迴，而人類也在科技之中反覆重演相同的慾望。",

"人們曾經害怕光碟損壞、資料消失，後來才明白，最先損壞的是人類自身的感知。",

"2783年的我們考古2026年的遺物時發現，他們留下最多的不是思想，而是無數無法讀取的檔案。",

"當最後一片光碟停止轉動後，人類終於聽見了——那些被科技噪音掩蓋已久的自己。"

]

const start=
document.getElementById("start")

const msg=
document.getElementById("msg")

const music=
document.getElementById("music")

function typeWriter(text){

msg.innerHTML=""

msg.style.display="block"

let i=0

const speed=90

const typing=setInterval(()=>{

msg.innerHTML=

text.substring(0,i)

+

'<span class="cursor">|</span>'

i++

if(i>text.length){

clearInterval(typing)

msg.innerHTML=text

}

},speed)

}

start.onclick=()=>{

const random=

Math.floor(

Math.random()

*

messages.length

)

start.style.display="none"

music.volume=.7

music.play()

typeWriter(
messages[random]
)

}

</script>

</body>

</html>
