<!DOCTYPE html>
<html lang="zh-Hant">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1">

<title>NAGA</title>

<style>

@font-face{

font-family:"Cubic";

src:

url("Cubic_11.ttf")

format("truetype");

}

*{
box-sizing:border-box;
}

body{

margin:0;

width:100vw;

height:100vh;

overflow:hidden;

background:black;

color:white;

font-family:"Cubic";

}

#bgVideo{

position:fixed;

top:0;

left:0;

width:100%;

height:100%;

object-fit:cover;

z-index:-2;

}

.overlay{

position:fixed;

inset:0;

background:

rgba(0,0,0,.35);

z-index:-1;

}

.page{

width:100vw;

height:100vh;

display:flex;

justify-content:center;

align-items:center;

padding:8vw;

}

.box{

width:88vw;

min-height:45vh;

display:flex;

justify-content:center;

align-items:center;

flex-direction:column;

padding:40px;

text-align:center;

background:

rgba(0,0,0,.18);

backdrop-filter:

blur(10px);

border-radius:28px;

}

button{

padding:

14px 36px;

font-size:22px;

border-radius:999px;

background:

rgba(255,255,255,.08);

border:

1px solid white;

color:white;

font-family:"Cubic";

letter-spacing:4px;

}

#msg{

display:none;

font-size:

clamp(
30px,
7vw,
54px
);

line-height:1.8;

letter-spacing:5px;

animation:

fade 2.5s ease;

}

@keyframes fade{

from{

opacity:0;

transform:

translateY(30px);

filter:

blur(10px);

}

to{

opacity:1;

transform:

translateY(0);

filter:

blur(0);

}

}

</style>

</head>

<body>

<video
id="bgVideo"
autoplay
muted
loop
playsinline>

<source
src="bg.mp4"
type="video/mp4">

</video>

<div class="overlay"></div>

<div class="page">

<div class="box">

<button
id="start">

開始

</button>

<div
id="msg">

</div>

</div>

</div>

<audio
id="music"
src="music.mp3"
loop>

</audio>

<script>

const messages=[

"第一句放這裡",

"第二句放這裡",

"第三句放這裡",

"第四句放這裡",

"第五句放這裡",

"第六句放這裡",

"第七句放這裡",

"第八句放這裡",

"第九句放這裡",

"第十句放這裡"

]

const start=

document
.getElementById(
"start"
)

const msg=

document
.getElementById(
"msg"
)

const music=

document
.getElementById(
"music"
)

start
.onclick=()=>{

const random=

Math.floor(

Math.random()

*

messages.length

)

msg.innerText=

messages[
random
]

start.style.display=

"none"

msg.style.display=

"block"

music.volume=

0.7

music.play()

}

</script>

</body>

</html>
